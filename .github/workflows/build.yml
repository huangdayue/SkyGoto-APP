name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    
    - name: Build with Gradle
      run: |
        echo "=== Build started at $(date) ==="
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        echo "=== Gradle exit code: $EXIT_CODE ==="
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Build failed!"
          cat build.log 2>/dev/null || true
          exit 1
        fi
    
    - name: List APK files
      run: |
        echo "=== APK Files ==="
        ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK dir"
        ls -la android/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No APK files"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyGoto-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7